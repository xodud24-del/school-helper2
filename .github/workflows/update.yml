name: 급식·시간표 업데이트

on:
  schedule:
    - cron: "40 20 * * *"   # 매일 05:40 (한국 시간)
    - cron: "10 3 * * 1-5"  # 평일 12:10 (시간표 변경 반영)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pycomcigan
      - run: python update.py
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "school-helper-bot"
          git config user.email "school-helper-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "급식·시간표 업데이트 $(TZ=Asia/Seoul date +'%m/%d %H:%M')"
          git push
