<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="북과 도우미">
<meta name="theme-color" content="#f4f5f8">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>경기북과고 도우미</title>
<style>
/* Layout: ZUDO-style app — soft gray ground, rounded white cards, one gradient hero per tab, two-tab bottom bar */
:root{
  padding-top:env(safe-area-inset-top,0px);
  --bg:#f4f5f8; --card:#ffffff; --ink:#191b23; --sub:#6b7080; --faint:#a3a8b5; --line:#eceef3;
  --blue:#3b6cf6; --violet:#7b4df2; --pink:#e14fa0; --orange:#f08a2c; --yellow:#f5bf36;
  --marker:#fff2a8; --chip:#eef1fb;
  --g-hero:#6c5cf2;
  --g-blue:#3f68ee;
  --g-sun:#f39a2e;
  --g-noon:#3f8ef2;
  --g-night:#8a5cf0;
  --f:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --r:22px; --shadow:0 1px 2px rgba(20,24,40,.04),0 6px 20px rgba(20,24,40,.06);
  --tab-h:64px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:20px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
input{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{padding:6px 4px 18px}
header.top .hello{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
header.top .sub{color:var(--sub);font-size:14px;margin-top:2px}

.view{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-title{font-size:13px;font-weight:700;color:var(--sub);padding:6px 6px 0}

/* hero gradient card */
.hero{border-radius:var(--r);color:#fff;padding:22px;display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:start}
.hero.meal{background:var(--g-hero)}
.hero.tt{background:var(--g-blue)}
.hero .ico{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.hero .ico svg{width:28px;height:28px}
.hero .k{font-size:13px;opacity:.85;font-weight:600}
.hero .big{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.3;margin-top:2px;word-break:keep-all}
.hero .rest{font-size:15px;opacity:.9;margin-top:6px;word-break:keep-all}
.hero .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.25);font-size:14px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.hero .pill{background:rgba(255,255,255,.22);color:#fff}

/* banner */
.banner{border-radius:var(--r);background:var(--g-sun);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.banner .t{font-weight:800;font-size:17px;letter-spacing:-.02em}
.banner .s{font-size:13px;opacity:.9}
.banner .dd{font-size:22px;font-weight:800;white-space:nowrap}

/* date chips */
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:none;min-width:64px;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;line-height:1.2}
.dates .w{font-size:12px;color:var(--faint);font-weight:600}
.dates .n{font-size:16px;font-weight:800;white-space:nowrap}
.dates button.past .n{color:var(--faint)}
.dates button.gap{margin-left:10px}
.dates button[aria-pressed="true"]{background:var(--ink);color:#fff}
.dates button[aria-pressed="true"] .w{color:rgba(255,255,255,.7)}

/* meal cards */
.meal{padding:18px 20px 18px}
.meal-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.meal-h .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.meal-h .ico svg{width:22px;height:22px}
.meal-h .name{font-size:18px;font-weight:800;letter-spacing:-.02em}
.meal-h .time{font-size:13px;color:var(--faint);font-weight:600}
.meal-h .kc{margin-left:auto;font-size:15px;font-weight:700;color:var(--sub)}
.meal.now{outline:2px solid var(--ink);outline-offset:-2px}
.mains{display:flex;flex-direction:column;gap:6px}
.mains .m{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.4;word-break:keep-all}
.mains .m span{background:linear-gradient(transparent 55%,var(--marker) 55%,var(--marker) 94%,transparent 94%);padding:0 2px}
.sides{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sides span{background:var(--bg);border-radius:10px;padding:5px 10px;font-size:14px;color:var(--ink);word-break:keep-all}
.basics{margin-top:12px;font-size:13px;color:var(--faint)}
.empty-card{padding:28px 20px;text-align:center;color:var(--sub)}
.empty-card b{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}

/* class picker */
.seg{display:flex;flex-direction:column;gap:10px;padding:16px}
.seg .row{display:flex;align-items:center;gap:8px}
.seg .g{width:46px;font-size:13px;font-weight:700;color:var(--sub);flex:none}
.seg .opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:1}
.seg button{border-radius:12px;background:var(--bg);padding:8px 0;font-weight:700;font-size:14px;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* today list */
.periods{padding:6px 8px}
.periods .p{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:13px 12px;border-radius:16px}
.periods .p + .p{margin-top:2px}
.periods .no{font-weight:800;font-size:15px;color:var(--faint)}
.periods .no small{display:block;font-size:11px;font-weight:600}
.periods .s{font-weight:700;font-size:16px}
.periods .tch{font-size:15px;color:var(--faint);font-weight:600}
.mark{font-weight:700}
.mark.su{color:var(--pink)}
.mark.chg{color:var(--orange)}
.mark.due{color:var(--blue)}
.periods .p.cur{background:var(--chip)}
.periods .p.cur .no{color:var(--blue)}
.periods .p.done .s{color:var(--faint)}
.tag{font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px;background:#fff1e4;color:var(--orange);margin-left:6px;vertical-align:2px}

/* week grid */
.weekhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.weekhead .t{font-weight:800;font-size:17px}
.wk{display:flex;background:var(--bg);border-radius:12px;padding:3px}
.wk button{padding:6px 12px;border-radius:10px;font-size:13px;font-weight:700;color:var(--sub)}
.wk button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid-wrap{overflow-x:auto;padding:6px 10px 14px}
table.tt{width:100%;min-width:330px;border-collapse:separate;border-spacing:4px;table-layout:fixed}
table.tt th{font-size:12px;font-weight:700;color:var(--faint);padding:4px 0}
table.tt th.today{color:var(--blue)}
table.tt th.pc,table.tt td.pc{width:30px}
table.tt td.pc{font-size:12px;font-weight:800;color:var(--faint);text-align:center;line-height:1.2}
table.tt td.pc small{display:block;font-size:9px;font-weight:600}
table.tt td.c{background:var(--bg);border-radius:12px;height:50px;text-align:center;vertical-align:middle;font-size:13px;font-weight:700;padding:4px 2px;word-break:keep-all;line-height:1.25}
table.tt td.c.today{background:var(--chip);color:var(--blue)}
table.tt td.c.blank{color:var(--faint);font-weight:400}
table.tt td.c .tc{display:block;font-size:10px;font-weight:600;color:var(--faint);margin-top:2px}
table.tt td.c.chg{box-shadow:inset 0 0 0 1.5px var(--orange)}
table.tt td.c input{width:100%;border:0;border-bottom:2px solid var(--blue);background:transparent;text-align:center;outline:none;font-size:13px;font-weight:700}
.note{font-size:12px;color:var(--faint);padding:0 18px 16px;margin:0;line-height:1.6}
.loadnote{font-size:13px;color:var(--sub);text-align:center}

/* 수행평가 */
.badge{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px;background:var(--pink);color:#fff;margin-left:4px;vertical-align:2px}
table.tt td.c.has{background:#fde8f3;color:#b02a74}
table.tt td.c .hv{display:block;font-size:10px;font-weight:800;color:var(--pink);margin-top:2px}
.periods .p{cursor:pointer}
.tasks{padding:6px 8px}
.tasks .row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-radius:16px;cursor:pointer}
.tasks .dd{font-weight:800;font-size:15px;color:var(--pink)}
.tasks .dd.far{color:var(--sub)}
.tasks .tt1{font-weight:700;font-size:15px;line-height:1.35;word-break:keep-all}
.tasks .tt2{font-size:12px;color:var(--faint)}
.tasks .arr{color:var(--faint)}
.tasks .none{padding:14px 12px;color:var(--faint);font-size:14px}
.sheet-bg{position:fixed;inset:0;background:rgba(15,18,30,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:86vh;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet .sh-k{font-size:13px;font-weight:700;color:var(--sub)}
.sheet .sh-t{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:2px 0 14px}
.sheet .item{background:var(--bg);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.sheet .item b{display:block;font-size:16px;word-break:keep-all}
.sheet .item p{margin:4px 0 0;font-size:14px;color:var(--sub);white-space:pre-wrap;word-break:break-word}
.sheet .item .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--faint)}
.sheet .item .del{color:var(--pink);font-weight:700;font-size:12px}
.sheet .empty{color:var(--faint);font-size:14px;margin:0 0 12px}
.sheet form{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.sheet input,.sheet textarea{width:100%;border:0;border-radius:14px;background:var(--bg);padding:12px 14px;font:inherit;font-size:16px;outline:none;resize:none}
.sheet input:focus,.sheet textarea:focus{box-shadow:0 0 0 2px var(--blue) inset}
.sheet .btns{display:flex;gap:8px;margin-top:4px}
.sheet .btn{flex:1;border-radius:14px;padding:13px 0;font-weight:800;font-size:16px;background:var(--ink);color:#fff}
.sheet .btn.ghost{background:var(--bg);color:var(--ink)}
.sheet .btn:disabled{opacity:.5}
.sheet .msg{font-size:13px;color:var(--sub);min-height:18px}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:14px;padding:4px}
.kind button{border-radius:11px;padding:13px 4px;font-weight:700;font-size:15px;color:var(--sub);line-height:1.3}
.kind button small{display:block;font-size:11px;font-weight:600;color:var(--faint)}
.kind button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ktag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.ktag.su{background:#fde8f3;color:#b02a74}
.ktag.due{background:#e6efff;color:#2f5bd8}
.addrow{display:block;width:calc(100% - 8px);margin:4px 4px 6px;padding:11px 0;border-radius:14px;background:var(--bg);font-weight:800;font-size:14px;color:var(--blue)}
.duerow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duerow label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--sub)}
.sheet .duerow input{padding:10px 12px;min-height:46px;-webkit-appearance:none;appearance:none}
.sheet .item p.when{color:var(--blue);font-weight:700;font-size:13px;margin-top:4px}

/* tiles */
.tile{display:flex;align-items:center;gap:14px;padding:16px 18px;text-decoration:none;color:var(--ink)}
.tile .ico{width:44px;height:44px;border-radius:14px;background:var(--chip);display:grid;place-items:center;color:var(--violet);flex:none}
.tile .ico svg{width:22px;height:22px}
.tile b{font-size:16px}
.tile span{display:block;font-size:13px;color:var(--faint)}
.tile .arr{margin-left:auto;color:var(--faint)}

/* 내 계획 */
.hero.plan{background:#f0892c}
.pdates{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.pdates::-webkit-scrollbar{display:none}
.pdates button{flex:none;min-width:64px;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;line-height:1.2;position:relative}
.pdates .w{font-size:12px;color:var(--faint);font-weight:600}
.pdates .n{font-size:16px;font-weight:800;white-space:nowrap}
.pdates .n.sun{color:#e5534b}
.pdates .n.sat{color:var(--blue)}
.pdates button[aria-pressed="true"] .n{color:#fff}
.pdates .w.sun{color:#e5534b}
.pdates .w.sat{color:var(--blue)}
.pdates button .dot{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--orange)}
.pdates button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pdates button[aria-pressed="true"] .w{color:rgba(255,255,255,.7)}
.plans{padding:6px 8px}
.plans .pr{display:grid;grid-template-columns:34px 48px 1fr auto;gap:6px;align-items:center;padding:9px 8px;border-radius:14px}
.plans .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.plans .pr.done .ck{background:var(--orange);border-color:var(--orange)}
.plans .pr.done .pt{color:var(--faint);text-decoration:line-through}
.plans .ptm{font-size:13px;font-weight:800;color:var(--orange)}
.plans .ptm{white-space:nowrap}
.plans .ptm.none{color:var(--faint);font-weight:600}
.plans .pt{font-size:16px;font-weight:700;word-break:keep-all;line-height:1.35}
.plans .px{color:var(--faint);font-size:18px;padding:0 6px}
.plans .none{padding:14px 10px;color:var(--faint);font-size:14px}
.duelist .dr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px}
.duelist .dr .tt2{font-size:12px;color:var(--faint)}
.duelist .dr .tt1{font-weight:700;font-size:15px}
.duelist .dr button{font-size:13px;font-weight:800;color:var(--orange);background:#fff3e6;border-radius:10px;padding:7px 10px;white-space:nowrap}
.padd{display:grid;grid-template-columns:96px 1fr auto;gap:8px;padding:12px}
.padd input{border:0;border-radius:12px;background:var(--bg);padding:11px 10px;font-size:16px;outline:none;min-width:0;min-height:44px;-webkit-appearance:none;appearance:none}
.padd input:focus{box-shadow:0 0 0 2px var(--orange) inset}
.padd button{border-radius:12px;background:var(--ink);color:#fff;font-weight:800;padding:0 16px}
.privacy{font-size:12px;color:var(--faint);text-align:center;margin:0}

/* tab bar */
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);background:rgba(255,255,255,.92);z-index:9}
nav.tabs{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:var(--tab-h);background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:10;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--faint);font-size:12px;font-weight:700}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--ink)}

/* ---- 사람 냄새 나게: 한 가지 포인트 색, 흰 카드, 색 블록·아이콘 상자·작은 머리말 없음 ---- */
:root{ --accent:#f0641e; --accent-soft:#fff1e8; --bg:#f2f3f5; --line:#e7e8ec; }
.card,.hero,.banner{box-shadow:none;border:1px solid var(--line)}
.hero,.hero.meal,.hero.tt,.hero.plan{background:var(--card);color:var(--ink);grid-template-columns:1fr;gap:0;padding:20px}
.hero .ico{display:none}
.hero .k{font-size:16px;font-weight:800;opacity:1;color:var(--ink);letter-spacing:-.02em}
.hero .big{font-size:23px;margin-top:8px}
.hero .rest{color:var(--sub);opacity:1}
.banner{background:var(--card);color:var(--ink)}
.banner .s{color:var(--sub);opacity:1}
.banner .dd{color:var(--accent)}
.meal-h .ico{display:none}
.meal-h{margin-bottom:10px}
.meal.now{outline:none;border-color:var(--ink)}
.tile .ico{background:none;width:auto;height:auto;color:var(--ink)}
.sec-title{font-size:18px;font-weight:800;color:var(--ink);padding:14px 4px 0;letter-spacing:-.02em}
header.top .hello{font-size:26px}
.dates button,.pdates button{box-shadow:none;border:1px solid var(--line)}
.dates button[aria-pressed="true"],.pdates button[aria-pressed="true"]{border-color:var(--ink)}
.pdates button .dot{background:var(--accent)}
.seg button[aria-pressed="true"],.wk button[aria-pressed="true"]{background:var(--ink);color:#fff}
.periods .p.cur{background:var(--accent-soft)}
.periods .p.cur .no{color:var(--accent)}
table.tt th.today{color:var(--accent)}
table.tt td.c.today{background:var(--accent-soft);color:var(--ink)}
table.tt td.c.has{background:var(--accent);color:#fff}
table.tt td.c.chg{box-shadow:inset 0 0 0 1.5px var(--ink)}
.mark.su{color:var(--accent)}
.mark.due{color:var(--ink)}
.mark.chg{color:var(--sub)}
.tasks .dd{color:var(--accent)}
.addrow{color:var(--ink)}
.sheet input:focus,.sheet textarea:focus,.padd input:focus{box-shadow:0 0 0 2px var(--ink) inset}
.sheet .item p.when{color:var(--ink)}
.plans .pr.done .ck{background:var(--accent);border-color:var(--accent)}
.plans .ptm{color:var(--accent)}
.duelist .dr button{color:var(--ink);background:var(--bg)}
nav.tabs a[aria-current="page"]{color:var(--ink)}

/* ---- 테두리 없이, 과목·끼니별 색 ---- */
.card,.hero,.banner{border:none}
.dates button,.pdates button{border:none}
.dates button[aria-pressed="true"],.pdates button[aria-pressed="true"]{background:var(--ink)}
.meal.now{outline:none;border:none;box-shadow:0 0 0 2px var(--ink) inset}
.meal-h .ico{display:inline-grid;width:auto;height:auto;background:none!important;place-items:center}
.meal-h .ico svg{width:24px;height:24px}
.meal-h{gap:8px}
.m-breakfast .ico{color:#f29a1f} .m-breakfast .name{color:#c76d00}
.m-lunch .ico{color:#2f9e5b} .m-lunch .name{color:#1f7a44}
.m-dinner .ico{color:#5b5bd6} .m-dinner .name{color:#4343b0}
.hero.meal{background:#fff6e9} .hero.tt{background:#eef5ff} .hero.plan{background:#fff0f0}
.hero.meal .k{color:#c76d00} .hero.tt .k{color:#2f62c9} .hero.plan .k{color:#c9453b}
.banner{background:#fff1e8}
table.tt td.c.today{background:inherit}
table.tt td.c.today{font-weight:800}
table.tt td.c.s-math{background:#e7f0ff;color:#2752b8}
table.tt td.c.s-sci{background:#e5f6ec;color:#1f7a44}
table.tt td.c.s-eng{background:#f0e9ff;color:#5b3fb8}
table.tt td.c.s-kor{background:#ffe9e6;color:#b8392b}
table.tt td.c.s-soc{background:#fff4d6;color:#966400}
table.tt td.c.s-info{background:#e3f6f8;color:#11788a}
table.tt td.c.s-art{background:#fde8f3;color:#a8336f}
table.tt td.c.s-etc{background:var(--bg);color:var(--sub)}
table.tt td.c.has{background:var(--accent)!important;color:#fff!important}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px}
.sdot.s-math{background:#3b6fe0}.sdot.s-sci{background:#2f9e5b}.sdot.s-eng{background:#7a5ae0}.sdot.s-kor{background:#e0503f}
.sdot.s-soc{background:#e0a400}.sdot.s-info{background:#1aa3b8}.sdot.s-art{background:#d6488f}.sdot.s-etc{background:#b5b9c4}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="hello" id="hello">급식</div>
    <div class="sub num" id="subline">경기북과학고등학교</div>
  </header>

  <!-- 급식 -->
  <main class="view" id="v-meal">
    <div id="heroMeal"></div>
    <div id="banner"></div>
    <div class="dates" id="dates"></div>
    <div id="meals" class="view"></div>
    <a class="card tile" href="https://www.zudo.my/" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>
      <div><b>ZUDO</b><span>기숙사 관리 시스템</span></div>
      <span class="arr">›</span>
    </a>
    <p class="loadnote" id="loadNote" hidden></p>
  </main>

  <!-- 내 계획 -->
  <main class="view" id="v-plan" hidden>
    <div id="heroPlan"></div>
    <div class="pdates" id="pdates"></div>
    <div class="sec-title" id="planTitle">할 일</div>
    <div class="card plans" id="plans"></div>
    <form class="card padd" id="planForm">
      <input id="planTime" type="time" aria-label="시간 (선택)">
      <input id="planText" maxlength="80" placeholder="할 일 (예: 수학 문제집 3장)" autocomplete="off">
      <button type="submit">추가</button>
    </form>
    <div class="sec-title" id="dueTitle">이 날 반 일정</div>
    <div class="card duelist" id="duelist"></div>
    <p class="privacy">내 계획은 이 기기에만 저장돼요. 다른 친구들에게는 보이지 않아요.</p>
  </main>

  <!-- 시간표 -->
  <main class="view" id="v-tt" hidden>
    <div id="heroTT"></div>
    <div class="card seg" id="picker"></div>
    <div class="sec-title">다가오는 수행평가·과제</div>
    <div class="card tasks" id="tasks"></div>
    <div class="sec-title" id="todayTitle">오늘</div>
    <div class="card periods" id="periods"></div>
    <div class="card">
      <div class="weekhead"><span class="t">주간 시간표</span><div class="wk" id="weeks"></div></div>
      <div class="grid-wrap"><table class="tt" id="tt"></table></div>
      <p class="note" id="ttNote"></p>
    </div>
  </main>
</div>

<nav class="tabs" aria-label="메뉴">
  <a href="#meal" data-v="meal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h16a8 8 0 0 1-16 0z"/><path d="M9 4c0 2 2 2 2 4M14 4c0 2 2 2 2 4"/></svg>급식</a>
  <a href="#tt" data-v="tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 3v3M16 3v3M8 14h3M8 17h6"/></svg>시간표</a>
  <a href="#plan" data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2.5 2.5L16 9"/><rect x="3.5" y="3.5" width="17" height="17" rx="4"/></svg>내 계획</a>
</nav>
<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const svg = s => { const t = document.createElement("template"); t.innerHTML = s.trim(); return t.content.firstChild; };
  const ICON = {
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18h18M6 18a6 6 0 0 1 12 0M12 6V4M5.6 9.6 4.2 8.2M18.4 9.6l1.4-1.4"/></svg>',
    bowl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M9 4c0 2 2 2 2 4M14 4c0 2 2 2 2 4"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
    book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-8-1.5v14c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-14c-3-.5-6 0-8 1.5z"/><path d="M12 6v14"/></svg>'
  };
  const MEALS = [
    { k:"breakfast", name:"조식", time:"07:00", end:8.5*60, ico:"sun", g:"var(--g-sun)" },
    { k:"lunch", name:"중식", time:"13:00", end:13.75*60, ico:"bowl", g:"var(--g-noon)" },
    { k:"dinner", name:"석식", time:"18:00", end:19.5*60, ico:"moon", g:"var(--g-night)" },
  ];
  const WD = ["일","월","화","수","목","금","토"];
  const GRADES = [1,2,3], CLASSES = [1,2,3,4,5];
  const PERIOD_MIN = 50;
  const state = { meals:[], events:[], tts:{}, loaded:{meals:false,events:false,tt:false}, myClass:"1-2", ttWeek:"this", sel:null, tasks:[], tasksFor:null };

  // ---- 수행평가 저장소 (Supabase) ----
  const SB_URL = "https://ppgfqdcwwlbqatgikgdr.supabase.co";
  const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwZ2ZxZGN3d2xicWF0Z2lrZ2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4NzYxMjEsImV4cCI6MjEwOTQ1MjEyMX0.Tkm04HW4O6bykr1OngfYNjzMI6RjaHXcpet9k1SLAKQ";   // anon 키 (공개용)
  const sbReady = () => !!(SB_URL && SB_KEY);
  async function sb(path, opts = {}){
    const r = await fetch(SB_URL + path, { ...opts, headers: { apikey: SB_KEY, "Content-Type": "application/json", ...(opts.headers || {}) } });
    if (!r.ok) throw new Error(await r.text());
    const t = await r.text(); return t ? JSON.parse(t) : null;
  }
  const store = { get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  let myToken = store.get("shToken", null);
  if (!myToken){ myToken = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); store.set("shToken", myToken); }
  const mine = new Set(store.get("shMine", []));
  const uuid = () => crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ Math.random() * 16 >> c / 4).toString(16));
  try { state.myClass = localStorage.getItem("myClass") || "1-2"; } catch {}

  // ---- time (KST) ----
  const kst = (o=0) => new Date(Date.now() + 9*3600e3 + o*86400e3);
  const ymd = d => d.getUTCFullYear() + String(d.getUTCMonth()+1).padStart(2,"0") + String(d.getUTCDate()).padStart(2,"0");
  const fromYmd = s => new Date(Date.UTC(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8)));
  const addDays = (s,n) => ymd(new Date(fromYmd(s).getTime() + n*86400e3));
  const wd = s => fromYmd(s).getUTCDay();
  const md = s => `${+s.slice(4,6)}월 ${+s.slice(6,8)}일`;
  const TODAY = ymd(kst());
  const nowMin = () => { const d = kst(); return d.getUTCHours()*60 + d.getUTCMinutes(); };
  const dday = s => Math.round((fromYmd(s) - fromYmd(TODAY)) / 86400e3);
  const monday = addDays(TODAY, wd(TODAY) === 0 ? 1 : wd(TODAY) === 6 ? 2 : 1 - wd(TODAY));
  const isWeekend = d => wd(d) === 0 || wd(d) === 6;

  // which meal is "next" right now
  function upcomingMeal(){
    let day = TODAY, idx = MEALS.findIndex(m => nowMin() < m.end);
    if (idx === -1 || isWeekend(day)) { day = isWeekend(TODAY) || idx === -1 ? addDays(TODAY, 1) : TODAY; idx = 0; while (isWeekend(day)) day = addDays(day, 1); }
    return { day, idx };
  }
  state.sel = isWeekend(TODAY) ? monday : TODAY;

  $("subline").textContent = `경기북과학고 · ${md(TODAY)} ${WD[wd(TODAY)]}요일`;

  // ---- tabs ----
  const VIEWS = ["meal","tt","plan"];
  function show(){
    const v = (location.hash || "#meal").slice(1), view = VIEWS.includes(v) ? v : "meal";
    VIEWS.forEach(k => $("v-"+k).hidden = k !== view);
    document.querySelectorAll("nav.tabs a").forEach(a => a.dataset.v === view ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
    $("hello").textContent = view === "meal" ? "급식" : view === "tt" ? "시간표" : "내 계획";
    if (view === "plan") queueMicrotask(() => renderPlanAll());
    window.scrollTo(0,0);
  }
  addEventListener("hashchange", show); show();

  // ---- meals ----
  const BASIC = /(혼합잡곡밥|발아현미밥|흑미밥|차조밥|찰보리밥|서리태콩밥|통밀밥|보조밥.*|쌀밥|백미밥)$|김치$|깍두기|석박지|겉절이|단무지|^우유$|시리얼|식빵|모닝빵|장아찌/;
  const clean = s => s.replace(/^과일-/, "");
  const mealOf = (day, k) => state.meals.find(x => x.date === day)?.[k];

  function renderHeroMeal(){
    const box = $("heroMeal"); box.textContent = "";
    const { day, idx } = upcomingMeal(), m = MEALS[idx], meal = mealOf(day, m.k);
    const hero = el("div","hero meal");
    const ico = el("div","ico"); ico.append(svg(ICON[m.ico]));
    const body = el("div");
    const when = day === TODAY ? "오늘" : day === addDays(TODAY,1) ? "내일" : md(day);
    body.append(el("div","k", `${when} ${m.name}`));
    if (!state.loaded.meals) body.append(el("div","big","불러오는 중"));
    else if (!meal?.dishes?.length) body.append(el("div","big","급식 정보가 없어요"));
    else {
      const mains = (meal.main?.length ? meal.main : meal.dishes.slice(1,2)).map(clean);
      body.append(el("div","big", mains.join(" · ")));
      const rest = meal.dishes.filter(d => !(meal.main||[]).includes(d) && !BASIC.test(d)).map(clean);
      if (rest.length) body.append(el("div","rest", rest.join(", ")));
      body.append(el("div","rest num", `${m.time}부터${meal.kcal ? " · " + Math.round(meal.kcal) + " kcal" : ""}`));
    }
    hero.append(ico, body); box.append(hero);
  }

  function renderBanner(){
    const b = $("banner"); b.textContent = "";
    const next = state.events.find(e => e.date >= TODAY && /정기시험|정기고사|중간고사|기말고사|지필/.test(e.title) && !/수능|대학수학능력/.test(e.title));
    if (!next) return;
    const n = dday(next.date), card = el("div","banner"), left = el("div");
    left.append(el("div","t", next.title), el("div","s", `${md(next.date)} ${WD[wd(next.date)]}요일`));
    card.append(left, el("div","dd num", n === 0 ? "D-day" : `D-${n}`));
    b.append(card);
  }

  function renderDates(){
    const s = $("dates"); s.textContent = "";
    for (let w=0; w<2; w++) for (let i=0; i<5; i++){
      const d = addDays(monday, w*7+i), b = el("button");
      b.type = "button"; b.setAttribute("aria-pressed", String(d === state.sel));
      if (d < TODAY) b.classList.add("past");
      if (w === 1 && i === 0) b.classList.add("gap");
      b.append(el("span","n num", d === TODAY ? "오늘" : `${+d.slice(6,8)} ${WD[wd(d)]}`));
      b.onclick = () => { state.sel = d; renderDates(); renderMeals(); };
      s.append(b);
    }
    const on = s.querySelector('[aria-pressed="true"]'); if (on) on.scrollIntoView({inline:"center", block:"nearest"});
  }

  function renderMeals(){
    const box = $("meals"); box.textContent = "";
    if (!state.loaded.meals) return;
    const has = MEALS.filter(m => mealOf(state.sel, m.k)?.dishes?.length);
    if (!has.length){
      const c = el("div","card empty-card"), t = el("b", null, `${md(state.sel)} ${WD[wd(state.sel)]}요일`);
      c.append(t, document.createTextNode(state.sel > (state.meals.at(-1)?.date || "") ? "아직 급식표가 올라오지 않았어요" : "급식이 없는 날이에요"));
      return box.append(c);
    }
    const up = upcomingMeal();
    for (const m of has){
      const meal = mealOf(state.sel, m.k), main = new Set(meal.main || []);
      const card = el("div","card meal m-" + m.k + (state.sel === up.day && MEALS[up.idx].k === m.k ? " now" : ""));
      const h = el("div","meal-h"), ico = el("div","ico"); ico.append(svg(ICON[m.ico]));
      const nm = el("div","name", `${m.name} ${m.time}`);
      h.append(ico, nm); if (meal.kcal) h.append(el("span","kc num",`${Math.round(meal.kcal)} kcal`));
      const mains = el("div","mains"), sides = el("div","sides"), basics = [];
      for (const d of meal.dishes){
        if (main.has(d)) { const r = el("div","m"); r.append(el("span",null,clean(d))); mains.append(r); }
        else if (BASIC.test(d)) basics.push(clean(d));
        else sides.append(el("span",null,clean(d)));
      }
      card.append(h);
      if (mains.childElementCount) card.append(mains);
      if (sides.childElementCount) card.append(sides);
      if (basics.length) card.append(el("div","basics", basics.join(" · ")));
      box.append(card);
    }
  }

  // ---- timetable ----
  const blankWeek = { days:{}, teachers:{}, changed:{} };
  const weekOf = (doc, which) => !doc ? blankWeek : which === "next" ? (doc.next || blankWeek) : doc;
  function weekForDate(doc, date){
    if (doc?.next?.weekStart && date >= doc.next.weekStart) return weekOf(doc,"next");
    if (doc?.weekStart && date < doc.weekStart) return blankWeek;
    return weekOf(doc,"this");
  }
  const subjClass = s => {
    s = s || "";
    if (/수학|심수|미적|기하|확률|대수/.test(s)) return "s-math";
    if (/물리|화학|생명|지구|물질|역학|과학|연구|실험|과탐|생물|천문/.test(s)) return "s-sci";
    if (/영어|영작|영문|English/i.test(s)) return "s-eng";
    if (/국어|문학|독서|화법|작문|언어/.test(s)) return "s-kor";
    if (/통사|사회|역사|한국사|윤리|지리|경제|정치/.test(s)) return "s-soc";
    if (/정보|알고리즘|프로그래밍|코딩|인공지능/.test(s)) return "s-info";
    if (/체육|스포츠|음악|미술|예술/.test(s)) return "s-art";
    return "s-etc";
  };
  const toMin = t => { const [h,m] = String(t).split(":").map(Number); return h*60 + (m||0); };

  function renderPicker(){
    const p = $("picker"); p.textContent = "";
    GRADES.forEach(g => {
      const row = el("div","row"), opts = el("div","opts");
      row.append(el("span","g",`${g}학년`));
      CLASSES.forEach(c => {
        const key = `${g}-${c}`, b = el("button",null,`${c}반`); b.type = "button";
        b.setAttribute("aria-pressed", String(state.myClass === key));
        b.onclick = () => { state.myClass = key; try { localStorage.setItem("myClass", key); } catch {} renderTTAll(); };
        opts.append(b);
      });
      row.append(opts); p.append(row);
    });
  }

  function ttDay(){
    // today on weekdays; otherwise next Monday
    return isWeekend(TODAY) ? monday : TODAY;
  }

  function renderHeroTT(){
    const box = $("heroTT"); box.textContent = "";
    const doc = state.tts[state.myClass], day = ttDay(), w = weekForDate(doc, day);
    const list = w.days?.[wd(day)] || [], teach = w.teachers?.[wd(day)] || [], times = doc?.times || [];
    const hero = el("div","hero tt"), ico = el("div","ico"); ico.append(svg(ICON.book));
    const body = el("div");
    const cls = state.myClass.replace("-","학년 ") + "반";
    if (!state.loaded.tt){ body.append(el("div","k",cls), el("div","big","불러오는 중")); }
    else if (!list.some(Boolean)){ body.append(el("div","k",cls), el("div","big","시간표가 없어요")); }
    else {
      const now = day === TODAY ? nowMin() : -1;
      let curIdx = -1, nextIdx = -1;
      list.forEach((s,i) => { if (!s || !times[i]) return; const st = toMin(times[i]);
        if (now >= st && now < st + PERIOD_MIN) curIdx = i; else if (now < st && nextIdx === -1) nextIdx = i; });
      const last = list.reduce((a,s,i) => s ? i : a, -1);
      let k, big, rest = "";
      if (curIdx >= 0){ k = `${cls} · 지금 ${curIdx+1}교시`; big = list[curIdx]; rest = teach[curIdx] ? `${teach[curIdx]} 선생님` : "";
        const n = list.findIndex((s,i) => i > curIdx && s); if (n >= 0) rest += (rest ? " · " : "") + `다음 ${n+1}교시 ${list[n]}`; }
      else if (nextIdx >= 0){ k = `${cls} · ${day === TODAY ? "다음" : md(day)} ${nextIdx+1}교시`; big = list[nextIdx]; rest = `${times[nextIdx]} 시작` + (teach[nextIdx] ? ` · ${teach[nextIdx]} 선생님` : ""); }
      else { k = `${cls} 오늘 수업`; big = "모두 끝났어요"; rest = `${last+1}교시까지 있었어요`; }
      body.append(el("div","k",k), el("div","big",big));
      if (rest) body.append(el("div","rest",rest));
      const foot = { append(){} };
      const chg = (w.changed?.[wd(day)] || []).filter(Boolean).length;
      if (chg) body.append(el("div","rest", `오늘 바뀐 수업 ${chg}개`));
    }
    hero.append(ico, body); box.append(hero);
  }

  function renderPeriods(){
    const box = $("periods"); box.textContent = "";
    const day = ttDay();
    $("todayTitle").textContent = day === TODAY ? "오늘 수업" : `${md(day)} ${WD[wd(day)]}요일 수업`;
    const doc = state.tts[state.myClass], w = weekForDate(doc, day);
    const list = w.days?.[wd(day)] || [], teach = w.teachers?.[wd(day)] || [], chg = w.changed?.[wd(day)] || [], times = doc?.times || [];
    if (!list.some(Boolean)){ box.append(el("div","empty-card","아직 시간표가 없어요")); return; }
    const now = day === TODAY ? nowMin() : -1;
    list.forEach((s,i) => {
      if (!s) return;
      const st = times[i] ? toMin(times[i]) : null;
      const row = el("div","p" + (st != null && now >= st && now < st + PERIOD_MIN ? " cur" : st != null && now >= st + PERIOD_MIN ? " done" : ""));
      const no = el("div","no num", `${i+1}교시`);
      const sj = el("div","s"); sj.append(el("span","sdot " + subjClass(s)), document.createTextNode(s));
      const nS = tasksAt(day, i+1).length;
      if (nS) sj.append(el("span","mark su", " · 수행평가"));
      else if (chg[i]) sj.append(el("span","mark chg", " · 바뀐 수업"));
      row.append(no, sj, el("div","tch num", times[i] || ""));
      row.onclick = () => openSheet(day, i+1, s, teach[i] || "");
      box.append(row);
    });
  }

  function renderWeeks(){
    const w = $("weeks"); w.textContent = "";
    [["this","이번 주"],["next","다음 주"]].forEach(([k,label]) => {
      const b = el("button",null,label); b.type = "button"; b.setAttribute("aria-pressed", String(state.ttWeek === k));
      b.onclick = () => { state.ttWeek = k; renderWeeks(); renderGrid(); }; w.append(b);
    });
  }

  function renderGrid(){
    const t = $("tt"); t.textContent = "";
    const doc = state.tts[state.myClass], wk = weekOf(doc, state.ttWeek), isThis = state.ttWeek === "this";
    const days = wk.days || {}, teach = wk.teachers || {}, chg = wk.changed || {}, times = doc?.times || [];
    const head = el("tr"); head.append(el("th","pc",""));
    for (let d=1; d<=5; d++) head.append(el("th", isThis && d === wd(TODAY) ? "today" : null, WD[d]));
    const thead = el("thead"); thead.append(head); t.append(thead);
    let rows = 7; for (let d=1; d<=5; d++) (days[d]||[]).forEach((s,i) => { if (s) rows = Math.max(rows, i+1); });
    const body = el("tbody");
    for (let p=0; p<rows; p++){
      const tr = el("tr"), pc = el("td","pc num", String(p+1)); tr.append(pc);
      for (let d=1; d<=5; d++){
        const v = (days[d]||[])[p] || "";
        const date = wk.weekStart ? addDays(wk.weekStart, d-1) : null;
        const has = date ? tasksAt(date, p+1).length : 0;
        const td = el("td","c " + (v ? subjClass(v) : "") + (isThis && d === wd(TODAY) ? " today" : "") + (v ? "" : " blank") + ((chg[d]||[])[p] ? " chg" : "") + (has ? " has" : ""), v || "·");

        if (date && v) td.onclick = () => openSheet(date, p+1, v, (teach[d]||[])[p] || "");
        tr.append(td);
      }
      body.append(tr);
    }
    t.append(body);
    const upd = doc?.updated ? `${+doc.updated.slice(5,7)}월 ${+doc.updated.slice(8,10)}일 ${doc.updated.slice(11,16)}` : "";
    $("ttNote").textContent = !state.loaded.tt ? "불러오는 중" : !doc ? "아직 이 반 시간표가 없어요." :
      `컴시간 알리미 기준${upd ? " · " + upd + " 업데이트" : ""}. 주황 칸은 수행평가, 검은 테두리는 바뀐 수업이에요. 칸을 누르면 선생님과 수행평가를 볼 수 있어요.`;
  }

  // ---------- 수행평가(교시) · 과제(날짜+시간 마감) ----------
  const isDue = t => t.kind === "과제";
  const tasksAt = (date, period) => state.tasks.filter(t => !isDue(t) && t.date === date && t.period === period);
  const duesOn = date => state.tasks.filter(t => isDue(t) && t.date === date);
  const isoDate = s => `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
  const sortKey = t => t.date + (isDue(t) ? (t.due_time || "23:59") : (state.tts[state.myClass]?.times?.[t.period-1] || String(t.period).padStart(2,"0")));
  const sortTasks = () => state.tasks.sort((a,b) => sortKey(a).localeCompare(sortKey(b)));
  const duePassed = t => isDue(t) && t.date === TODAY && t.due_time && toMin(t.due_time) <= nowMin();

  async function loadTasks(){
    const cls = state.myClass; state.tasksFor = cls;
    if (!sbReady()){ state.tasks = []; renderTasks(); return; }
    try {
      const from = isoDate(addDays(monday, -7));
      const rows = await sb(`/rest/v1/assessments?select=id,class,date,period,subject,title,note,kind,due_time,created_at&class=eq.${encodeURIComponent(cls)}&date=gte.${from}&order=date.asc&limit=500`);
      if (state.myClass !== cls) return;
      state.tasks = rows.map(r => ({ ...r, kind: r.kind || "수행", date: r.date.replaceAll("-","") }));
      sortTasks();
    } catch { state.tasks = []; }
    renderTasks(); renderPeriods(); renderGrid(); if (!$("v-plan").hidden) renderPlanAll();
  }

  function taskWhen(t){
    return isDue(t) ? `${md(t.date)} ${WD[wd(t.date)]} ${t.due_time || "23:59"}까지${t.subject ? " · " + t.subject : ""}`
                    : `${md(t.date)} ${WD[wd(t.date)]} · ${t.period}교시 ${t.subject || ""}`;
  }
  function kindTag(t){ return el("span","mark " + (isDue(t) ? "due" : "su"), isDue(t) ? "과제 · " : "수행 · "); }

  function renderTasks(){
    const box = $("tasks"); box.textContent = "";
    if (!sbReady()) return box.append(el("div","none","저장소가 아직 연결되지 않았어요."));
    const addRow = el("button","addrow","+ 과제 추가"); addRow.type = "button";
    addRow.onclick = () => openDue(isWeekend(addDays(TODAY,1)) ? monday : addDays(TODAY,1));
    const up = state.tasks.filter(t => t.date >= TODAY && !duePassed(t)).slice(0, 10);
    if (!up.length) box.append(el("div","none","등록된 수행평가·과제가 없어요. 교시를 누르거나 아래 버튼으로 추가해보세요."));
    up.forEach(t => {
      const n = dday(t.date), row = el("div","row");
      row.append(el("div","dd num" + (n > 7 ? " far" : ""), n === 0 ? "오늘" : `D-${n}`));
      const t1 = el("div","tt1"); t1.append(kindTag(t), document.createTextNode(t.title));
      const mid = el("div"); mid.append(t1, el("div","tt2", taskWhen(t)));
      row.append(mid, el("span","arr","›"));
      row.onclick = () => isDue(t) ? openDue(t.date) : openSheet(t.date, t.period, t.subject, "");
      box.append(row);
    });
    box.append(addRow);
  }

  let sheetCtx = null;
  function closeSheet(){ $("sheetBg").hidden = true; sheetCtx = null; document.body.style.overflow = ""; }
  $("sheetBg").addEventListener("click", e => { if (e.target.id === "sheetBg") closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetCtx) closeSheet(); });

  function itemList(sh, items, reopen){
    items.forEach(t => {
      const it = el("div","item"), tb = el("b");
      tb.append(kindTag(t), document.createTextNode(t.title)); it.append(tb);
      if (isDue(t)) it.append(el("p","when", taskWhen(t)));
      if (t.note) it.append(el("p",null,t.note));
      const meta = el("div","meta"); meta.append(el("span",null, "올린 날 " + new Date(t.created_at).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})));
      if (mine.has(t.id)){
        const del = el("button","del","삭제"); del.type = "button"; let armed = false;
        del.onclick = async () => {
          if (!armed){ armed = true; del.textContent = "한 번 더 누르면 삭제"; setTimeout(() => { armed = false; del.textContent = "삭제"; }, 3000); return; }
          del.disabled = true;
          try { await sb("/rest/v1/rpc/delete_assessment", { method:"POST", body: JSON.stringify({ p_id: t.id, p_token: myToken }) });
            mine.delete(t.id); store.set("shMine", [...mine]); state.tasks = state.tasks.filter(x => x.id !== t.id);
            renderTasks(); renderPeriods(); renderGrid(); reopen();
          } catch { del.textContent = "삭제하지 못했어요"; }
        };
        meta.append(del);
      }
      it.append(meta); sh.append(it);
    });
  }

  async function saveTask(row, msg, btn, reopen){
    btn.disabled = true; msg.textContent = "저장 중…";
    const id = uuid();
    try {
      await sb("/rest/v1/assessments", { method:"POST", headers:{ Prefer:"return=minimal" },
        body: JSON.stringify({ id, class: state.myClass, token: myToken, ...row, date: isoDate(row.date) }) });
      mine.add(id); store.set("shMine", [...mine]);
      state.tasks.push({ id, class: state.myClass, ...row, created_at: new Date().toISOString() }); sortTasks();
      renderTasks(); renderPeriods(); renderGrid(); reopen(row);
    } catch { msg.textContent = "저장하지 못했어요. 잠시 후 다시 해주세요."; btn.disabled = false; }
  }

  // 날짜·시간 입력칸 + 제목·메모 폼
  function buildForm(sh, { kindToggle, kind: k0, date, time, subject, period, teacher }){
    const f = el("form"); f.noValidate = true;
    let kind = k0;
    const kd = el("div","kind");
    const kb1 = el("button"); kb1.type = "button"; kb1.append("수업 중 수행평가");
    const kb2 = el("button"); kb2.type = "button"; kb2.append("마감 있는 과제");
    const dueRow = el("div","duerow");
    const dIn = el("input"); dIn.type = "date"; dIn.value = isoDate(date); dIn.setAttribute("aria-label","마감 날짜");
    const tIn = el("input"); tIn.type = "time"; tIn.value = time || "23:59"; tIn.setAttribute("aria-label","마감 시간");
    const dl = el("label"); dl.append(el("span",null,"마감 날짜"), dIn);
    const tl = el("label"); tl.append(el("span",null,"마감 시간"), tIn);
    dueRow.append(dl, tl);
    const sIn = el("input"); sIn.maxLength = 30; sIn.placeholder = "과목 (선택)"; sIn.value = subject || ""; sIn.autocomplete = "off";
    const ti = el("input"); ti.maxLength = 60; ti.autocomplete = "off";
    const no = el("textarea"); no.rows = 2; no.maxLength = 300; no.placeholder = "메모 (준비물, 범위, 제출 방법 등 · 선택)";
    const msg = el("div","msg");
    const btns = el("div","btns"), cancel = el("button","btn ghost","닫기"), add = el("button","btn","추가");
    cancel.type = "button"; cancel.onclick = closeSheet; add.type = "submit"; btns.append(cancel, add);
    const setKind = k => {
      kind = k; kb1.setAttribute("aria-pressed", String(k === "수행")); kb2.setAttribute("aria-pressed", String(k === "과제"));
      dueRow.hidden = k !== "과제"; sIn.hidden = k !== "과제" || !!kindToggle;
      ti.placeholder = k === "수행" ? "수행평가 이름 (예: 실험 보고서 작성)" : "과제 이름 (예: 탐구 보고서 제출)";
    };
    kb1.onclick = () => setKind("수행"); kb2.onclick = () => setKind("과제"); kd.append(kb1, kb2);
    if (kindToggle) f.append(kd);
    f.append(dueRow, sIn, ti, no, msg, btns); sh.append(f); setKind(kind);
    f.addEventListener("submit", e => {
      e.preventDefault();
      const title = ti.value.trim(), note = no.value.trim();
      if (!title){ msg.textContent = (kind === "과제" ? "과제" : "수행평가") + " 이름을 적어주세요."; ti.focus(); return; }
      if (kind === "과제"){
        const dv = (dIn.value || "").replaceAll("-",""), tv = tIn.value || "23:59";
        if (dv.length !== 8){ msg.textContent = "마감 날짜를 골라주세요."; return; }
        saveTask({ kind:"과제", date: dv, due_time: tv.slice(0,5), period: null, subject: (kindToggle ? subject : sIn.value.trim()) || "", title, note }, msg, add,
          r => openDue(r.date));
      } else {
        saveTask({ kind:"수행", date, period, subject, title, note, due_time: null }, msg, add, () => openSheet(date, period, subject, teacher));
      }
    });
  }

  function openSheet(date, period, subject, teacher){
    sheetCtx = { date, period };
    const sh = $("sheet"); sh.textContent = "";
    sh.append(el("div","grab"), el("div","sh-k", `${md(date)} ${WD[wd(date)]}요일 · ${period}교시 · ${state.myClass.replace("-","학년 ")}반`),
      el("div","sh-t", subject + (teacher ? ` (${teacher})` : "")));
    const items = tasksAt(date, period);
    if (!items.length) sh.append(el("p","empty","이 수업에 등록된 수행평가가 없어요."));
    itemList(sh, items, () => openSheet(date, period, subject, teacher));
    if (!sbReady()) sh.append(el("p","empty","저장소가 아직 연결되지 않아서 추가할 수 없어요."));
    else {
      const times = state.tts[state.myClass]?.times || [];
      buildForm(sh, { kindToggle: true, kind: "수행", date, time: times[period-1] || "23:59", subject, period, teacher });
    }
    $("sheetBg").hidden = false; document.body.style.overflow = "hidden";
  }

  function openDue(date){
    sheetCtx = { date };
    const sh = $("sheet"); sh.textContent = "";
    sh.append(el("div","grab"), el("div","sh-k", `${state.myClass.replace("-","학년 ")}반`), el("div","sh-t", `${md(date)} ${WD[wd(date)]}요일 마감 과제`));
    const items = duesOn(date);
    if (!items.length) sh.append(el("p","empty","이 날 마감인 과제가 없어요."));
    itemList(sh, items, () => openDue(date));
    if (!sbReady()) sh.append(el("p","empty","저장소가 아직 연결되지 않아서 추가할 수 없어요."));
    else buildForm(sh, { kindToggle: false, kind: "과제", date, time: "23:59", subject: "" });
    $("sheetBg").hidden = false; document.body.style.overflow = "hidden";
  }

  // ---------- 내 계획 (이 기기에만 저장) ----------
  let plans = store.get("shPlans", []);
  const savePlans = () => store.set("shPlans", plans);
  state.planSel = TODAY;
  const plansOn = d => plans.filter(x => x.date === d).sort((a,b) => (a.time || "99:99").localeCompare(b.time || "99:99") || a.at - b.at);

  function renderHeroPlan(){
    const box = $("heroPlan"); box.textContent = "";
    const list = plansOn(TODAY), left = list.filter(x => !x.done);
    const hero = el("div","hero plan"), ico = el("div","ico");
    ico.append(svg('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2.5 2.5L16 9"/><rect x="3.5" y="3.5" width="17" height="17" rx="4"/></svg>'));
    const body = el("div");
    if (!list.length){ body.append(el("div","k","오늘 할 일"), el("div","big","아직 계획이 없어요"), el("div","rest","아래에서 오늘 할 일을 적어보세요")); }
    else if (!left.length){ body.append(el("div","k",`오늘 할 일 ${list.length}개`), el("div","big","모두 했어요")); }
    else {
      const nx = left[0];
      body.append(el("div","k",`오늘 할 일 · ${left.length}개 남음`), el("div","big", nx.title));
      if (nx.time) body.append(el("div","rest", `${nx.time}에 하기로 했어요`));
    }
    if (list.length) body.append(el("div","rest num", `${list.filter(x => x.done).length}개 끝냄 · 전체 ${list.length}개`));
    hero.append(ico, body); box.append(hero);
  }
  function renderPlanDates(){
    const s2 = $("pdates"); s2.textContent = "";
    for (let i=0; i<14; i++){
      const d = addDays(TODAY, i), b = el("button"); b.type = "button";
      b.setAttribute("aria-pressed", String(d === state.planSel));
      const n = el("span","n num" + (wd(d) === 0 ? " sun" : wd(d) === 6 ? " sat" : ""), i === 0 ? "오늘" : i === 1 ? "내일" : `${+d.slice(6,8)} ${WD[wd(d)]}`);
      b.append(n);
      if (plansOn(d).some(x => !x.done) || state.tasks.some(t => t.date === d)) b.append(el("span","dot"));
      b.onclick = () => { state.planSel = d; renderPlanAll(); };
      s2.append(b);
    }
  }
  function renderPlans(){
    const d = state.planSel, box = $("plans"); box.textContent = "";
    $("planTitle").textContent = `${d === TODAY ? "오늘" : d === addDays(TODAY,1) ? "내일" : md(d) + " " + WD[wd(d)] + "요일"} 할 일`;
    const list = plansOn(d);
    if (!list.length) box.append(el("div","none","아직 계획이 없어요. 아래 칸에 적고 추가를 누르세요."));
    list.forEach(x => {
      const r = el("div","pr" + (x.done ? " done" : ""));
      const ck = el("button","ck"); ck.type = "button"; ck.setAttribute("aria-label", x.done ? "완료 취소" : "완료");
      if (x.done) ck.append(svg('<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'));
      ck.onclick = () => { x.done = !x.done; savePlans(); renderPlanAll(); };
      const del = el("button","px","×"); del.type = "button"; del.setAttribute("aria-label","삭제");
      let armed = false;
      del.onclick = () => { if (!armed){ armed = true; del.textContent = "삭제?"; setTimeout(() => { armed = false; del.textContent = "×"; }, 2500); return; }
        plans = plans.filter(y => y.id !== x.id); savePlans(); renderPlanAll(); };
      r.append(ck, el("div","ptm num" + (x.time ? "" : " none"), x.time || "—"), el("div","pt", x.title), del);
      box.append(r);
    });
  }
  function renderDueList(){
    const d = state.planSel, box = $("duelist"); box.textContent = "";
    const list = state.tasks.filter(t => t.date === d);
    $("dueTitle").textContent = `${state.myClass.replace("-","학년 ")}반 수행평가·과제 (${d === TODAY ? "오늘" : md(d)})`;
    if (!list.length){ box.append(el("div","dr")); box.lastChild.append(el("div","tt2","이 날 마감인 수행평가·과제가 없어요.")); return; }
    list.forEach(t => {
      const r = el("div","dr"), left = el("div"), t1 = el("div","tt1");
      t1.append(kindTag(t), document.createTextNode(t.title)); left.append(t1, el("div","tt2", taskWhen(t)));
      const b = el("button",null,"+ 계획"); b.type = "button";
      b.onclick = () => { $("planText").value = `${t.title} 준비`; $("planText").focus(); };
      r.append(left, b); box.append(r);
    });
  }
  function renderPlanAll(){ renderHeroPlan(); renderPlanDates(); renderPlans(); renderDueList(); }
  $("planForm").addEventListener("submit", e => {
    e.preventDefault();
    const title = $("planText").value.trim(); if (!title){ $("planText").focus(); return; }
    plans.push({ id: uuid(), date: state.planSel, time: ($("planTime").value || "").slice(0,5), title, done: false, at: Date.now() });
    savePlans(); $("planText").value = ""; $("planTime").value = ""; renderPlanAll();
  });

  function renderMealAll(){ renderHeroMeal(); renderBanner(); renderDates(); renderMeals(); }
  function renderTTAll(){ renderHeroTT(); renderPicker(); renderTasks(); renderPeriods(); renderWeeks(); renderGrid(); if (state.tasksFor !== state.myClass) loadTasks(); }
  renderMealAll(); renderTTAll();
  setInterval(() => { renderHeroMeal(); renderHeroTT(); renderPeriods(); if (!$("v-plan").hidden) renderHeroPlan(); }, 60000);

  // ---- data (data.json, refreshed every morning by GitHub Actions) ----
  async function load(){
    const timer = setTimeout(() => { $("loadNote").hidden = false; $("loadNote").textContent = "아직 불러오지 못했어요. 인터넷 연결을 확인해주세요."; }, 10000);
    try {
      const r = await fetch("data.json?t=" + Math.floor(Date.now() / 600000), { cache: "no-store" });
      const d = await r.json();
      state.meals = (d.meals || []).sort((a,b) => a.date.localeCompare(b.date));
      state.events = (d.events || []).sort((a,b) => a.date.localeCompare(b.date));
      state.tts = d.timetable || {};
      $("loadNote").hidden = true;
    } catch {
      $("loadNote").hidden = false; $("loadNote").textContent = "급식·시간표를 불러오지 못했어요. 잠시 후 다시 열어주세요.";
    } finally {
      clearTimeout(timer);
      for (const k in state.loaded) state.loaded[k] = true;
      renderMealAll(); renderTTAll();
    }
  }
  load();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible"){ load(); loadTasks(); } });
})();
</script>

</body>
</html>
